services:
  postgres:
    image: postgres:16-alpine
    container_name: prepsmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-PrepSmart}
      POSTGRES_USER: ${POSTGRES_USER:-prepsmarter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prepsmart_password_123}
    ports:
      - "127.0.0.1:5433:5432" # Bound to localhost for security
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-prepsmarter} -d ${POSTGRES_DB:-PrepSmart}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    container_name: prepsmart-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6370:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  app:
    image: prepsmart:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prepsmart-app
    restart: unless-stopped
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Connects to the postgres service within the docker network
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED}
      RATE_LIMIT_API_MAX: ${RATE_LIMIT_API_MAX}
      RATE_LIMIT_MUTATION_MAX: ${RATE_LIMIT_MUTATION_MAX}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX}
      RATE_LIMIT_PAGE_MAX: ${RATE_LIMIT_PAGE_MAX}
      RATE_LIMIT_ACTION_MAX: ${RATE_LIMIT_ACTION_MAX}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_net

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgres
    networks:
      - app_net

volumes:
  postgres_data:
  redis_data:

networks:
  app_net:
    driver: bridge
