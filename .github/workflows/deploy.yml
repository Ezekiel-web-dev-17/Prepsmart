name: CI/CD Security Gates & Production Deployment

# Implements the Secure-by-Design CI/CD architecture from:
# https://www.freecodecamp.org/news/secure-by-design-engineer-security-into-architecture-before-writing-code/#cicd-security-gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Gate 1: Security & Quality Gates
  # ==========================================
  security-and-quality-gates:
    name: Security & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history required for secret scanning

      - name: 1. Secret Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Configuration & Code Security Validation
        run: |
          echo "Verifying security-by-design configuration rules..."

          # Rule A: Disallow wildcard CORS in code and configuration
          if grep -rn "Access-Control-Allow-Origin: \*" src/ config/ 2>/dev/null; then
            echo "ERROR: Wildcard CORS detected! Must use explicit enumerated origins."
            exit 1
          fi

          # Rule B: Disallow plaintext private keys or hardcoded database passwords
          if grep -rnE "(PRIVATE KEY|BEGIN RSA PRIVATE KEY)" src/ 2>/dev/null; then
            echo "ERROR: Hardcoded private key detected in source code!"
            exit 1
          fi

          echo "Security validation passed."

      - name: 5. Dependency Vulnerability Gate (CVSS >= 7.0)
        run: |
          echo "Scanning dependencies for high/critical vulnerabilities (CVSS >= 7.0)..."
          npm audit --audit-level=high

      - name: 6. Generate Prisma Client
        run: npx prisma generate

      - name: 7. Static Type Safety Gate
        run: npx tsc --noEmit

  # ==========================================
  # Gate 2: Automated Production Deployment
  # ==========================================
  deploy-production:
    name: Deploy to EC2 Production
    needs: [security-and-quality-gates]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            echo "Starting zero-touch automated deployment on EC2..."
            cd ~/Prepsmart
            git pull origin main
            docker compose build app
            docker compose up -d app
            echo "Deployment completed successfully."

      - name: Post-Deployment Smoke & Health Verification
        run: |
          echo "Verifying production health endpoint..."
          sleep 5
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://prepsmart.tech/api/health)
            if [ "$STATUS" = "200" ]; then
              echo "Health check PASSED! Prepsmart is live and database is connected (HTTP 200 OK)."
              exit 0
            fi
            echo "Attempt $i: Received HTTP $STATUS, retrying in 3s..."
            sleep 3
          done
          echo "Health check FAILED: Application did not respond with 200 OK."
          exit 1
